<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Guesser</title>
<style>
  :root { --bg:#14213d; --card:#1d2f57; --text:#f1f5f9; --accent:#fca311; --muted:#9fb0cf; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Georgia, serif; padding:1rem; }
  main { background:var(--card); padding:2rem; border-radius:14px; width:100%; max-width:380px; text-align:center; }
  h1 { margin:0 0 .5rem; font-size:1.8rem; }
  p { color:var(--muted); margin:.4rem 0; }
  #message { color:var(--text); font-size:1.15rem; min-height:2.6rem; }
  input { width:100%; padding:.7rem; font-size:1.2rem; border-radius:8px; border:2px solid transparent; text-align:center; margin:.8rem 0; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { width:100%; padding:.7rem; font-size:1.05rem; font-weight:bold; border:0; border-radius:8px; background:var(--accent); color:#14213d; cursor:pointer; }
  #restart { display:none; margin-top:.6rem; background:transparent; color:var(--accent); border:2px solid var(--accent); }
  #history { font-size:.95rem; min-height:1.4rem; }
</style>
</head>
<body>
<main>
  <h1>Number Guesser</h1>
  <p>I'm thinking of a number from 1 to 100. You have 7 tries.</p>
  <p id="message">Make your first guess.</p>
  <input id="guess" type="number" min="1" max="100" placeholder="Your guess" aria-label="Your guess">
  <button id="submit">Guess</button>
  <button id="restart">Play again</button>
  <p id="tries">Tries left: 7</p>
  <p id="history"></p>
</main>

<script>
  const MAX_TRIES = 7;
  let secret, triesLeft, guesses;

  const input = document.getElementById("guess");
  const message = document.getElementById("message");
  const triesText = document.getElementById("tries");
  const history = document.getElementById("history");
  const submitBtn = document.getElementById("submit");
  const restartBtn = document.getElementById("restart");

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;
    triesLeft = MAX_TRIES;
    guesses = [];
    message.textContent = "Make your first guess.";
    triesText.textContent = "Tries left: " + triesLeft;
    history.textContent = "";
    input.value = "";
    input.disabled = false;
    submitBtn.disabled = false;
    restartBtn.style.display = "none";
    input.focus();
  }

  function endGame(text) {
    message.textContent = text;
    input.disabled = true;
    submitBtn.disabled = true;
    restartBtn.style.display = "block";
    restartBtn.focus();
  }

  function guess() {
    const value = Number(input.value);
    if (!Number.isInteger(value) || value < 1 || value > 100) {
      message.textContent = "Enter a whole number from 1 to 100.";
      return;
    }
    guesses.push(value);
    triesLeft--;
    triesText.textContent = "Tries left: " + triesLeft;
    history.textContent = "Your guesses: " + guesses.join(", ");
    input.value = "";

    if (value === secret) {
      endGame("You got it in " + guesses.length + " tries. The number was " + secret + ".");
    } else if (triesLeft === 0) {
      endGame("Out of tries. The number was " + secret + ".");
    } else {
      message.textContent = value < secret ? "Too low. Go higher." : "Too high. Go lower.";
      input.focus();
    }
  }

  submitBtn.addEventListener("click", guess);
  input.addEventListener("keydown", e => { if (e.key === "Enter") guess(); });
  restartBtn.addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
